name: Build Release (APK + EXE)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: node scripts/prepare.js
      - run: npx cap add android
      - run: node scripts/patch-android.js
      - run: npx cap sync android
      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          base64 -d keystore/debug.keystore.b64 > ~/.android/debug.keystore
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk IO-ARENA.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: IO-ARENA.apk
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node scripts/prepare.js
      - run: npm run win:build
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: |
            dist/IO-ARENA-Setup.exe
            dist/IO-ARENA-Portable.exe
  release:
    needs: [apk, exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - id: v
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.v }}
          name: IO ARENA v${{ steps.v.outputs.v }}
          make_latest: true
          files: |
            out/IO-ARENA.apk
            out/IO-ARENA-Setup.exe
            out/IO-ARENA-Portable.exe
